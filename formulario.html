<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1><b><i>My feedback form</i></b></h1>
    <form>
        <div>
             <label for="Fullname"><b>Name:</b></label>
             <input type="fullname"
                    id="fullname"
                    name="fullname"
                    placeholder="Ivan Perez"
                    required
                    maxlength="20"
                    minlength="2">
        </div>
        <div>
             <label for="email"><b>Email:</b></label>
             <input type="email"
                    placeholder="ivanperez@email.com"
                    required id="email"
                    name="email"> 
        </div> 
         <div>
             <label for="password"><b>Password:</b></label>
             <input type="password"
                    required id="password"
                    name="password">
         </div> 
           
        <div><samp><b>Please check all the emotions that apply to you:</b></samp></div> 
         
          <div>
              <label for="angry">Angry:</label>
              <input type="checkbox"
                     name="personal-emotions"
                     id="angry">
         </div>
          <div>
              <label for="happy">Happy:</label>
              <input type="checkbox"
                     name="personal-emotions"
                     id="happy">
          </div>
          <div>
              <label for="sad">Sad:</label>
              <input type="checkbox"
                     name="personal-emotions"
                     id="sad">
          </div>
           <div> 
               <label for="ambivalent">Ambivalent:</label>
               <input type="checkbox"
                      name="personal-emotions"
                      id="ambivalent">
           </div>

           <div><span><b>¿How satisfied were you with our service?</b></span></div>
          
           <div>
               <label for="very satisfied">Very satisfied</label>
               <input type="radio"
                      name="satisfactory-service"
                      id="very satisfied">
           </div>
            <div>
                <label for="satisfied">Satisfied:</label>
                <input type="radio"
                       name="satisfactory-service"
                       id="satisfied">
            </div>
            <div>
                <label for="didn´t care">Didn´t care</label>
                <input type="radio"
                       name="satisfactory-service"
                       id="didn´t care">
            </div>
            <div>
                <label for="dissatisfied">Dissatisfied</label>
                <input type="radio"
                       name="satisfactory-service"
                       id="dissatisfied">
            </div>
            <div>
                <label for="very dissatisfied">Very dissatisfied</label>
                <input type="radio"
                       name="satisfactory-service"
                       id="very dissatisfied">
            </div>
           
           <div>
               <label for="location visited"><b>Location visited:</b></label>
                    <select name="location" id="location">
                         <option value="no">Not selected</option>
                         <option value="bs.as">Buenos Aires</option>
                         <option value="catam.">Catamarca</option>
                         <option value="chaco">Chaco</option>
                         <option value="ctes">Corrientes</option>
                         <option value="e.rios">Entre Rios</option>
                         <option value="cba.">Cordoba</option>
                         <option value="chubut">Chubut</option>
                         <option value="form">Formosa</option>
                         <option value="l.p.">La Pampa</option>
                         <option value="jujuy">Jujuy</option>
                         <option value="l.r.">La Rioja</option>
                         <option value="mza.">Mendoza</option>
                         <option value="mnes.">Misiones</option>
                         <option value="nqn">Neuquen</option> 
                         <option value="r.n.">Rio Negro</option>
                         <option value="salta">Salta</option>
                         <option value="s. juan">San Juan</option>
                         <option value="s. luis">San Luis</option>
                         <option value="s.fe">Santa Fe</option>
                         <option value="sgo. del est.">Santiago del Estero</option>
                         <option value="tdf.">Tierra del Fuego</option>
                         <option value="tuc.">Tucuman</option> 
                   </select>
          </div>
          <div>
                 <label for="comment"><b>Further comments:</b></label>
                 <textarea name="comment"
                           id="comment" 
                           placeholder="hi, leave a comment."
                           rows="5"
                           cols="20"
                           maxlength="200"></textarea>
              </div>
              <button type="submit">registrarse</button>

    </form>
    
</body>
</html>
